# Publishes the app to a Hugging Face Space on every push.
# Setup (once): create a Docker Space on huggingface.co, then in this GitHub
# repo add the secret HF_TOKEN (a write token) and the variable HF_SPACE
# (e.g. "username/layers") under Settings -> Secrets and variables -> Actions.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main, claude/kind-tesla-yb8ego]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -e
          test -n "$HF_TOKEN" || { echo "::error::HF_TOKEN secret is missing"; exit 1; }
          mkdir /tmp/space
          # Spaces reject plain-git binary files, so images/tests stay out
          rsync -a --exclude .git --exclude .github --exclude samples --exclude tests --exclude output ./ /tmp/space/
          cd /tmp/space
          # The Space's README needs a config header
          { printf -- '---\ntitle: Layers\nemoji: 🧅\ncolorFrom: indigo\ncolorTo: pink\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'; cat README.md; } > README.tmp
          mv README.tmp README.md
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
